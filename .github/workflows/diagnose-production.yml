name: Diagnose production Solari

on:
  push:
    branches:
      - main

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel deployment
        run: sleep 45
      - name: Test launch
        run: curl -i -sS --max-time 70 'https://solariproject.vercel.app/api/diagnostics/solari?token=diag-20260912-7f0f0f59c8e14e4a9d47&step=launch'
      - name: Test WMS
        if: always()
        run: curl -i -sS --max-time 70 'https://solariproject.vercel.app/api/diagnostics/solari?token=diag-20260912-7f0f0f59c8e14e4a9d47&step=wms'
      - name: Test CCTV
        if: always()
        run: curl -i -sS --max-time 70 'https://solariproject.vercel.app/api/diagnostics/solari?token=diag-20260912-7f0f0f59c8e14e4a9d47&step=cctv'
